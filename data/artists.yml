# Artist alias table (SPEC §3.2). Maintained by hand — this is what FR-16/US-16
# "assign unrecognized artist" writes into. Accuracy here beats AI guessing (D15).
#
# 2026-09-21 (D15 reversal, see normalize.mjs): an unrecognized artist no
# longer blocks an event from showing — it just means that event has no
# tags_origin and no exclude-by-artist support until an entry is added here.
# This file is now an enrichment backlog, not a publish gate — cleared by
# looking up needs-review.json's "artist_unrecognized" items (web search,
# not guessing from the title alone) as part of the daily fetch routine.
#
# canonical: the name shown in the UI and used as the key for exclude rules.
# aliases: alternate spellings/romanizations seen in scraped titles.
# tags_origin_default: pre-fills 來源地 tag when a new event by this artist is normalized.

- canonical: 深海系樂團
  aliases: ["深海系", "Deep Sea Band"]
  tags_origin_default: 本地

- canonical: ABC Band
  aliases: ["A.B.C. Band", "ABC樂團"]
  tags_origin_default: 歐美

