# Venue -> city lookup (SPEC §5.3), for sources whose listing page gives a
# venue name but no address (tixcraft). Matched by substring against the raw
# venue text, first entry in this list that matches wins — so put specific
# names (e.g. "Legacy Taichung") ABOVE more generic ones they contain (e.g.
# "Legacy"), or the generic one will shadow it. Maintained by hand, same
# spirit as artists.yml — an unmatched venue just gets city: null and can be
# added here once you notice it in needs-review.
#
# Only ever write the common/simplified city spelling (台北, not 臺北) —
# parseTixcraftVenue() normalizes 臺→台 on both sides before matching
# (normalizeTraditionalChars in normalize.mjs), so a single "台北大巨蛋" entry
# already matches a source that renders it "臺北大巨蛋"; a second, parallel
# traditional-character entry is redundant and was removed once that
# normalization landed (2026-09-17 review).

- match: "高雄國家體育場"
  city: 高雄
- match: "Zepp New Taipei"
  city: 新北
- match: "台北大巨蛋"
  city: 台北
- match: "高雄巨蛋"
  city: 高雄
- match: "Legacy Taichung"
  city: 台中
- match: "Legacy Taipei"
  city: 台北
- match: "Legacy"
  city: 台北
- match: "台北小巨蛋"
  city: 台北
# "流行音樂中心" 本身太籠統：台北跟高雄各有一座流行音樂中心，原本只有一筆
# 通用條目、硬寫死城市是高雄，導致「台北流行音樂中心表演廳」的場次被誤標成
# 高雄（2026-09-18 打開頁面肉眼檢查時發現的真實 bug，不是理論推測）。拆成
# 兩筆更明確的名稱，順序不影響（互不為子字串）。
- match: "台北流行音樂中心"
  city: 台北
- match: "高雄流行音樂中心"
  city: 高雄

# 2026-09-17 追加：加 iNDIEVOX 之後發現這些場館名稱沒有地址可以判斷城市，
# 逐一查證後補上（見 LIVERADAR-SPEC.md §5.4）。
- match: "LIVE WAREHOUSE"
  city: 高雄
- match: "快樂谷大舞場"
  city: 台中
- match: "野地方"
  city: 台北
- match: "THE PILLARS"
  city: 台中
- match: "CLASH NEW TAIPEI"
  city: 新北
- match: "台中迴響"
  city: 台中
- match: "玉成戲院"
  city: 台北
- match: "百樂門酒館"
  city: 高雄
- match: "三創"
  city: 台北

# 2026-09-18 打開頁面肉眼檢查時發現的缺口：這幾個場館名稱本身就寫著城市名，
# 卻因為沒收錄進這份表而變成 city: 未知——寫一個小腳本比對「venue 裡有提到
# 的城市」跟「實際判定的 city」找出來的，不是靠肉眼一筆筆看。
- match: "台北國際會議中心"
  city: 台北
- match: "新北市工商展覽中心"
  city: 新北
- match: "桃園陽光劇場"
  city: 桃園

# 2026-09-21：Max 質疑「未知」城市裡有好幾個明明看得出城市，追出兩個根因
# （見 normalize.mjs 的 cityFromAddress/parseKktixVenue/parseTixcraftVenue 註解：
# 地址格式「郵遞區號+台灣+城市」原本比對不到、部分場館名稱本身就是可辨識場地
# 卻完全沒收錄進這份表）——這批是後者，逐一查證過真實地址/城市後補上。
- match: "SUB LIVE"
  city: 台北
- match: "The Wall"
  # Just "The Wall", not the full "The Wall Live House" — a real iNDIEVOX
  # listing writes it as "THE WALL表演廳外L形走廊" (an exterior corridor
  # attached to the venue), which only shares the "The Wall" prefix.
  city: 台北
- match: "Clapper Studio"
  city: 台北
- match: "國立體育大學綜合體育館"
  city: 桃園
- match: "WESTAR"
  city: 台北
- match: "PIPE Live Music"
  city: 台北
- match: "樂天桃園棒球場"
  city: 桃園
- match: "霧峰立法院民主議政園區"
  city: 台中
- match: "迴響音樂展演空間"
  city: 台中

# 2026-09-21：這筆不是場館名稱比對，是活動品牌名稱——iNDIEVOX 頁面完全沒寫
# 場地也沒在標題提城市，查證官方網站（formosapride.com）才知道固定辦在
# 新北市工商展覽中心。跟這份表其他條目共用同一個 parseTixcraftVenue 比對
# 機制，因為 normalize() 現在也會把場地欄位完全空白時的標題文字拿來這裡
# 查（見 normalize.mjs 的 title fallback 註解）。
- match: "X-Formosa"
  city: 新北
# DISORDER LIVE #22：iNDIEVOX 頁面/標題都沒寫場地，Max 貼出活動海報圖片，
# 上面清楚寫著「迴響音樂展演空間」——證實了先前查到「同系列的 #14 也辦在
# 迴響音樂展演空間」不是巧合，是這個系列固定辦在這裡。這個場地資訊只印在
# 海報圖片上、不在任何文字欄位，文字爬蟲原本就抓不到，是人工看圖確認的。
- match: "DISORDER LIVE"
  city: 台中
