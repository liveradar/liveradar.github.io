# 排除規則的「資料」部分（2026-11-17 從 scripts/normalize.mjs 搬出來）。
# 判斷邏輯仍在 normalize.mjs 的 exclusionReason()；這裡只放清單，
# 新增雜訊關鍵字只需要改這個檔，不用動程式碼。
#
# 全部都是「字面子字串比對」，不是 regex、沒有萬用字元：
#   noise_keywords / meet_and_greet_keywords  比對標題，不分大小寫
#   classical_keywords                        比對標題，區分大小寫
#   excluded_urls                             活動網址完全相同才算
#   excluded_kktix_accounts                   KKTIX 主辦帳號的子網域（xxx.kktix.cc 的 xxx）
#
# 加新關鍵字前，先確認它不會誤傷真正的演出（對 data/events.json 的標題搜一次），
# 並在上一行用註解寫下：日期、實際標題、為什麼排除。改完跑 npm test 與 npm run renormalize。

