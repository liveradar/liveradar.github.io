<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem("liveradar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>LiveRadar · 設定</title>
<meta name="description" content="LiveRadar 帳號登入、跨裝置同步、顯示模式等設定。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="LiveRadar" />
<meta property="og:title" content="LiveRadar · 設定" />
<meta property="og:description" content="LiveRadar 帳號登入、跨裝置同步、顯示模式等設定。" />
<meta property="og:url" content="https://liveradar.github.io/settings.html" />
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app" id="app">

  <div class="topbar page-content">
    <div class="page-title">設定</div>
  </div>

  <div class="page-content" style="display:flex;flex-direction:column;gap:18px;padding:12px 18px 18px;">

    <div class="section">
      <div class="section-title">顯示模式</div>
      <div class="card" style="flex-direction:row;flex-wrap:wrap;gap:8px;" data-chip-group="theme">
        <button type="button" class="chip-selectable" data-theme-value="system" aria-pressed="true">跟隨系統</button>
        <button type="button" class="chip-selectable" data-theme-value="light">淺色</button>
        <button type="button" class="chip-selectable" data-theme-value="dark">深色</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">帳號</div>
      <div class="card">
        <div id="account-logged-out" style="display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:13px;font-weight:700;">尚未登入</div>
          <div style="font-size:11px;color:var(--muted);">登入後可跨裝置同步收藏與排除設定，不登入也能完整使用 LiveRadar。</div>
          <button class="btn-dark" style="padding:9px;font-size:12px;" id="google-signin-btn">使用 Google 登入</button>
        </div>
        <div id="account-logged-in" class="row" hidden>
          <div style="font-size:13px;font-weight:700;word-break:break-all;" id="account-email"></div>
          <button class="btn-ghost" style="padding:6px 14px;font-size:12px;flex:0 0 auto;" id="signout-btn">登出</button>
        </div>
        <a href="./privacy.html" style="font-size:11px;color:var(--muted);text-decoration:underline;">隱私權政策</a>
      </div>
    </div>

    <div class="section">
      <div class="section-title">備份</div>
      <div class="card">
        <div style="font-size:12px;color:var(--muted);" id="backup-last">上次備份日期：無</div>
        <div style="display:flex;gap:8px;">
          <button class="btn-ghost" style="flex:1;padding:9px;font-size:12px;" id="export-btn">匯出 JSON</button>
          <button class="btn-ghost" style="flex:1;padding:9px;font-size:12px;" id="import-btn">匯入 JSON</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" hidden />
      </div>
    </div>

    <div class="section">
      <div class="section-title">排除設定</div>
      <div class="card">
        <div class="row">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:13px;font-weight:700;">嚴格模式</div>
            <div style="font-size:11px;color:var(--muted);">拼盤／音樂祭任一藝人命中即隱藏整場</div>
          </div>
          <label style="position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto;">
            <input type="checkbox" id="strict-mode" style="opacity:0;width:0;height:0;" />
            <span style="position:absolute;inset:0;background:var(--surface-2);border-radius:999px;"></span>
            <span style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none;"></span>
          </label>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:13px;font-weight:700;">靜音關鍵字</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;" id="mute-keywords"></div>
          <input class="field-input" type="text" id="mute-keyword-input" placeholder="新增關鍵字…" style="height:38px;" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">來源狀態</div>
      <div class="card" id="source-status">
        <div style="font-size:12px;color:var(--muted);">載入中…（M10 起讀 data/sources.json）</div>
      </div>
      <button class="btn-dark" id="refetch-btn" style="padding:11px;font-size:13px;">🔄 重新抓取最新演出</button>
      <div style="font-size:11px;color:var(--muted);" id="refetch-status"></div>
    </div>

    <div class="section">
      <div class="section-title">維運捷徑</div>
      <div class="card" style="padding:4px 16px;gap:0;">
        <a class="row" id="hidden-management-link" href="./hidden.html" style="padding:12px 0;border-bottom:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;">已隱藏管理 <span style="color:var(--muted);">›</span></a>
        <a class="row" id="review-queue-link" href="./review.html" style="padding:12px 0;color:var(--text);font-weight:700;font-size:13px;">待整理 <span style="color:var(--muted);">›</span></a>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="./index.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      時間表
    </a>
    <a class="nav-item" href="./new.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.35 1.77-.98 2.4L5 15h14l-1.02-1.1a3.4 3.4 0 0 1-.98-2.4V8a5 5 0 0 0-5-5Z"/></svg>
      新上架
    </a>
    <a class="nav-item" href="./favorites.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.5l1-5.8L3.5 9.6l5.9-.8Z"/></svg>
      收藏
    </a>
    <a class="nav-item nav-item--active" href="./settings.html">
      <span class="nav-item__pill">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12"/></svg>
        設定
      </span>
    </a>
  </nav>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
