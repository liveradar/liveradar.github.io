<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem("liveradar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>時間表 · LiveRadar</title>
<meta name="description" content="自動彙整 KKTIX、拓元、iNDIEVOX、FANSI GO、Ticket Plus 五個售票平台的音樂展演演出，一個地方看完所有場次時間表。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="時間表 · LiveRadar" />
<meta property="og:description" content="自動彙整 KKTIX、拓元、iNDIEVOX、FANSI GO、Ticket Plus 五個售票平台的音樂展演演出，一個地方看完所有場次時間表。" />
<meta property="og:url" content="https://liveradar.github.io/" />
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="wordmark">LiveRadar</div>
    <button type="button" class="icon-btn" id="search-toggle-btn" aria-label="搜尋" aria-expanded="false" aria-controls="search-panel">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

  <!-- Slide-down inline search — replaces navigating to search.html; reuses the timeline's already-loaded events (see wireInlineSearch() in src/app.js). search.html itself stays as a shareable/bookmarkable URL. -->
  <div class="search-panel" id="search-panel">
    <div class="search-panel__inner">
      <input type="search" class="field-input" id="inline-search-input" placeholder="搜尋藝人或標題…" aria-label="搜尋藝人或標題" />
    </div>
  </div>

  <div class="page-header">
    <div class="page-title">時間表</div>
    <div class="filter-row" data-view-filters>
      <button type="button" class="chip" data-filter="city">全部城市</button>
      <button type="button" class="chip" data-filter="month">全部月份</button>
      <button type="button" class="chip" data-filter="type">全部類型</button>
      <button type="button" class="chip" data-filter="origin">音樂人地區</button>
      <button type="button" class="chip" data-filter="price">價格</button>
    </div>
  </div>

  <!-- 2026-09-20: first-run intro/tutorial card, dismissed permanently once closed (src/state.js's loadIntroDismissed/dismissIntro) — local screen state, not synced across devices. -->
  <div class="card" id="intro-card" hidden style="margin:0 18px 12px;">
    <div class="row" style="align-items:flex-start;">
      <div style="font-size:13px;font-weight:800;">LiveRadar 是什麼？</div>
      <button type="button" id="intro-dismiss-btn" aria-label="關閉說明" style="border:none;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0;cursor:pointer;flex:0 0 auto;">✕</button>
    </div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;">
      把 KKTIX、拓元、iNDIEVOX、FANSI GO、Ticket Plus 的音樂演出全部收在一起，不用再一個一個網站翻。
    </div>
    <div style="font-size:12px;color:var(--muted);line-height:1.9;border-top:1px solid var(--border);padding-top:10px;">
      ★ 收藏喜歡的場次，✕ 排除不想看到的，之後都會記住。<br>
      可以篩城市、月份、類型、地區、價格，也可以直接搜尋演出者。<br>
      登入帳號後，換裝置也不會不見。
    </div>
  </div>

  <!-- FR-14/62, AC-14 (M10): shown when data/sources.json has a non-ok source. -->
  <a class="hidden-bar" id="source-warning-bar" href="./settings.html" hidden style="background:var(--warn-bg);color:var(--warn);text-decoration:none;">
    <span id="source-warning-text">⚠ 部分來源今天抓取異常，畫面資料可能不完整</span>
    <span class="hidden-bar__cta" style="color:var(--warn);">查看 →</span>
  </a>

  <!-- Populated by src/app.js from data/events.json (M4). Initial skeleton is replaced wholesale once loadEvents() resolves. -->
  <div class="event-list" id="event-list" data-page="timeline">
    <div class="event-card skeleton-card" aria-hidden="true">
      <div class="event-date">
        <div class="skeleton-block" style="width:30px;height:22px;border-radius:6px;"></div>
        <div class="skeleton-block" style="width:22px;height:11px;border-radius:4px;margin-top:6px;"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;padding-top:3px;">
        <div class="skeleton-block" style="width:82%;height:14px;border-radius:5px;"></div>
        <div class="skeleton-block" style="width:55%;height:12px;border-radius:5px;"></div>
        <div class="skeleton-block" style="width:40%;height:12px;border-radius:5px;"></div>
      </div>
    </div>
    <div class="event-card skeleton-card" aria-hidden="true">
      <div class="event-date">
        <div class="skeleton-block" style="width:30px;height:22px;border-radius:6px;"></div>
        <div class="skeleton-block" style="width:22px;height:11px;border-radius:4px;margin-top:6px;"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;padding-top:3px;">
        <div class="skeleton-block" style="width:65%;height:14px;border-radius:5px;"></div>
        <div class="skeleton-block" style="width:48%;height:12px;border-radius:5px;"></div>
        <div class="skeleton-block" style="width:42%;height:12px;border-radius:5px;"></div>
      </div>
    </div>
    <div class="event-card skeleton-card" aria-hidden="true" style="opacity:.6;">
      <div class="event-date">
        <div class="skeleton-block" style="width:30px;height:22px;border-radius:6px;"></div>
        <div class="skeleton-block" style="width:22px;height:11px;border-radius:4px;margin-top:6px;"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:9px;padding-top:3px;">
        <div class="skeleton-block" style="width:75%;height:14px;border-radius:5px;"></div>
        <div class="skeleton-block" style="width:50%;height:12px;border-radius:5px;"></div>
      </div>
    </div>
  </div>

  <button class="hidden-bar" id="hidden-bar" hidden>
    <span><strong id="hidden-count">0</strong> 場被規則隱藏</span>
    <span class="hidden-bar__cta">查看 →</span>
  </button>

  <nav class="bottom-nav">
    <a class="nav-item nav-item--active" href="./index.html">
      <span class="nav-item__pill">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        時間表
      </span>
    </a>
    <a class="nav-item" href="./new.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.35 1.77-.98 2.4L5 15h14l-1.02-1.1a3.4 3.4 0 0 1-.98-2.4V8a5 5 0 0 0-5-5Z"/></svg>
      新上架
    </a>
    <a class="nav-item" href="./favorites.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.5l1-5.8L3.5 9.6l5.9-.8Z"/></svg>
      收藏
    </a>
    <a class="nav-item" href="./settings.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12"/></svg>
      設定
    </a>
    <a class="fab" href="./add.html" aria-label="新增場次">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
