<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem("liveradar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>手動新增場次 · LiveRadar</title>
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app app--no-nav" id="app">

  <div class="page-header--with-back page-content">
    <a class="back-btn" href="./index.html" aria-label="返回">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="page-title page-title--sm">手動新增場次</div>
  </div>

  <div class="page-content" style="padding:6px 18px 4px;font-size:12px;color:var(--muted);">用於補上僅發布在社群平台的獨家場次</div>

  <form id="add-form" class="page-content" style="display:flex;flex-direction:column;gap:16px;padding:16px 18px;">

    <div class="field-group">
      <label class="field-label" for="f-date">演出日期 *</label>
      <input class="field-input" type="date" id="f-date" name="date" required />
    </div>

    <div class="field-group">
      <label class="field-label" for="f-time">開演時間</label>
      <input class="field-input" type="time" id="f-time" name="time" placeholder="尚未公布可留空" />
    </div>

    <div class="field-group">
      <label class="field-label" for="f-headliner">演出者 *</label>
      <input class="field-input" type="text" id="f-headliner" name="headliner" required placeholder="深夜合唱團" />
      <button type="button" class="btn-ghost" style="align-self:flex-start;border:none;padding:2px 0;color:var(--coral-ink);font-size:12px;" id="add-coartist">
        + 新增一位共演者
      </button>
    </div>

    <div class="field-group">
      <label class="field-label" for="f-venue">場館 *</label>
      <input class="field-input" type="text" id="f-venue" name="venue" required placeholder="The Wall" />
    </div>

    <div class="field-group">
      <label class="field-label" for="f-city">城市 *</label>
      <input class="field-input" type="text" id="f-city" name="city" required placeholder="台北" />
    </div>

    <div class="field-group">
      <label class="field-label" for="f-url">售票 / 資訊連結</label>
      <input class="field-input" type="url" id="f-url" name="ticket_url" placeholder="https://facebook.com/..." />
    </div>

    <fieldset class="field-group" style="border:none;padding:0;margin:0;">
      <legend class="field-label" style="padding:0;margin-bottom:7px;">演出性質</legend>
      <div style="display:flex;flex-wrap:wrap;gap:8px;" data-chip-group="tags_type">
        <button type="button" class="chip-selectable" aria-pressed="true">專場</button>
        <button type="button" class="chip-selectable">巡迴</button>
        <button type="button" class="chip-selectable">拼盤</button>
        <button type="button" class="chip-selectable">音樂祭</button>
        <button type="button" class="chip-selectable">見面會</button>
        <button type="button" class="chip-selectable">簽唱會</button>
        <button type="button" class="chip-selectable">音樂劇</button>
        <button type="button" class="chip-selectable">古典</button>
      </div>
    </fieldset>

    <fieldset class="field-group" style="border:none;padding:0;margin:0;">
      <legend class="field-label" style="padding:0;margin-bottom:7px;">來源地</legend>
      <div style="display:flex;flex-wrap:wrap;gap:8px;" data-chip-group="tags_origin">
        <button type="button" class="chip-selectable" aria-pressed="true">本地</button>
        <button type="button" class="chip-selectable">海外</button>
        <button type="button" class="chip-selectable">日韓</button>
        <button type="button" class="chip-selectable">歐美</button>
      </div>
    </fieldset>

    <div class="field-group">
      <label class="field-label" for="f-note">備註</label>
      <textarea class="field-input" id="f-note" name="note" rows="3" placeholder="於 IG 限時動態發布，尚未售票"></textarea>
    </div>

    <div style="display:flex;gap:10px;padding-top:6px;">
      <a class="btn-ghost" href="./index.html" style="flex:1;text-align:center;text-decoration:none;">取消</a>
      <button class="btn-primary" style="flex:1;" type="submit">儲存</button>
    </div>

  </form>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
