<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem("liveradar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>LiveRadar · 搜尋</title>
<meta name="description" content="在 LiveRadar 搜尋演出者或場次標題。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="LiveRadar" />
<meta property="og:title" content="LiveRadar · 搜尋" />
<meta property="og:description" content="在 LiveRadar 搜尋演出者或場次標題。" />
<meta property="og:url" content="https://liveradar.github.io/search.html" />
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app app--no-nav" id="app">

  <div class="page-header--with-back page-content">
    <a class="back-btn" href="./index.html" aria-label="返回">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="page-title page-title--sm">搜尋</div>
  </div>

  <div class="page-content" style="padding:4px 18px 6px;">
    <input type="search" class="field-input" id="search-input" placeholder="搜尋藝人或標題…" autofocus />
  </div>

  <!-- Populated by src/app.js from data/events.json, filtered by the input above. -->
  <div class="event-list" id="event-list" data-page="search">
    <div style="padding:32px 4px;text-align:center;color:var(--muted);font-size:13px;">輸入藝人或標題開始搜尋。</div>
  </div>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
