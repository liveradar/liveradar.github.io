name: Daily Update

on:
  # Schedule removed by product decision (S5, 2026-09-17): Max decided fetching
  # should be manual-only (a real button in settings.html, served by
  # scripts/dev-server.mjs — see LIVERADAR-SPEC.md §12 S5), not an unattended
  # daily cron. This also sidesteps M11's GitHub Actions IP-blocking problem
  # entirely, since fetches now only ever run from Max's own machine. This
  # workflow is kept only as a manually-triggerable fallback (workflow_dispatch)
  # in case you ever want to fetch from CI instead of locally.
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit data/*.json
      issues: write # FR-14/M10: notify.mjs opens an issue on source anomalies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/* # avoid pinning to a version Actions runners eventually deprecate
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, no extra secret needed (SPEC §10)
      - run: |
          git config user.name "liveradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data update $(date +%F)"
          git push
