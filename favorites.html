<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{var t=localStorage.getItem("liveradar:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>我的收藏 · LiveRadar</title>
<meta name="description" content="管理你在 LiveRadar 收藏的音樂展演場次，支援列表與月曆檢視。" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="我的收藏 · LiveRadar" />
<meta property="og:description" content="管理你在 LiveRadar 收藏的音樂展演場次，支援列表與月曆檢視。" />
<meta property="og:url" content="https://liveradar.github.io/favorites.html" />
<link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="wordmark">LiveRadar</div>
    <a class="icon-btn" href="./search.html" aria-label="搜尋">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
  </div>

  <div class="page-header">
    <div class="page-title">我的收藏</div>
    <div style="font-size:12px;color:var(--muted);font-weight:700;margin-top:8px;" id="fav-summary">共 0 場 · 依日期排序</div>
    <div class="filter-row">
      <button type="button" class="chip" data-fav-view="list" aria-pressed="true">列表</button>
      <button type="button" class="chip" data-fav-view="calendar">日曆</button>
    </div>
  </div>

  <!-- Populated by src/app.js from localStorage favorites + data/events.json (M5). -->
  <div class="event-list" id="event-list" data-page="favorites" style="gap:12px;">
    <div style="padding:32px 4px;text-align:center;color:var(--muted);font-size:13px;">載入中…</div>
  </div>

  <!-- Calendar view (FR: 收藏日曆檢視, 2026-09-18) — hidden by default, toggled by src/app.js. -->
  <div class="page-content" id="fav-calendar" style="padding:0 18px 18px;" hidden></div>

  <nav class="bottom-nav">
    <a class="nav-item" href="./index.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      時間表
    </a>
    <a class="nav-item" href="./new.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.35 1.77-.98 2.4L5 15h14l-1.02-1.1a3.4 3.4 0 0 1-.98-2.4V8a5 5 0 0 0-5-5Z"/></svg>
      新上架
    </a>
    <a class="nav-item nav-item--active" href="./favorites.html">
      <span class="nav-item__pill">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.5l1-5.8L3.5 9.6l5.9-.8Z"/></svg>
        收藏
      </span>
    </a>
    <a class="nav-item" href="./settings.html">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12"/></svg>
      設定
    </a>
    <a class="fab" href="./add.html" aria-label="新增場次">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </nav>

</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
